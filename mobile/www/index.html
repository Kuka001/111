  <div id="app">
    <!-- Tab roots. Content is rendered by app.js. -->
    <main class="app-content" id="tabsHost">
      <section class="tab-pane active" id="tab-chats" aria-label="Чаты"></section>
      <section class="tab-pane" id="tab-characters" aria-label="Персонажи"></section>
      <section class="tab-pane" id="tab-personas" aria-label="Персоны"></section>
      <section class="tab-pane" id="tab-settings" aria-label="Настройки"></section>
      <button class="fab hidden" id="newChatFab" data-action="new-chat"><svg class="ic"><use href="#i-chat-plus"/></svg>Новый чат</button>
    </main>

    <nav class="bottom-nav" id="bottomNav" aria-label="Разделы">
      <button class="nav-item active" data-action="tab" data-tab="chats" aria-label="Чаты">
        <span class="nav-pill"><svg class="ic"><use href="#i-chat"/></svg></span>
        <span class="nav-label">Чаты</span>
      </button>
      <button class="nav-item" data-action="tab" data-tab="characters" aria-label="Персонажи">
        <span class="nav-pill"><svg class="ic"><use href="#i-mask"/></svg></span>
        <span class="nav-label">Персонажи</span>
      </button>
      <button class="nav-item" data-action="tab" data-tab="personas" aria-label="Персоны">
        <span class="nav-pill"><svg class="ic"><use href="#i-user"/></svg></span>
        <span class="nav-label">Персоны</span>
      </button>
      <button class="nav-item" data-action="tab" data-tab="settings" aria-label="Настройки">
        <span class="nav-pill"><svg class="ic"><use href="#i-settings"/></svg><span id="navSettingsBadge" class="nav-badge hidden"></span></span>
        <span class="nav-label">Настройки</span>
      </button>
    </nav>

    <!-- Chat room: full-screen layer above the tabs. The id and appUI.closeChatRoom()
         are also used by the back-button fallback of older native engines. -->
    <section id="chatRoomView" class="chat-room hidden" aria-label="Чат">
      <header class="chat-header">
        <button class="icon-btn" data-action="close-chat" aria-label="Назад"><svg class="ic"><use href="#i-back"/></svg></button>
        <button class="chat-identity" data-action="chat-settings" aria-label="Настройки чата">
          <img id="chatHeaderAvatar" class="avatar avatar-36" alt="" />
          <span class="chat-identity-text">
            <span class="chat-identity-name" id="chatHeaderName">Персонаж</span>
            <span class="chat-identity-sub"><span class="status-dot" id="chatStatusDot"></span><span id="chatHeaderSub"></span></span>
          </span>
        </button>
        <button class="icon-btn" data-action="chat-settings" aria-label="Настройки чата"><svg class="ic"><use href="#i-sliders"/></svg></button>
      </header>

      <div class="chat-scroll" id="chatScroll">
        <div class="chat-feed" id="chatFeed"></div>
      </div>

      <button class="jump-btn hidden" id="jumpBtn" data-action="jump-bottom" aria-label="К последнему сообщению"><svg class="ic"><use href="#i-arrow-down"/></svg></button>

      <footer class="composer">
        <button class="icon-btn composer-tool" data-action="insert-action" aria-label="Действие *…*" title="Обернуть в *действие*"><svg class="ic"><use href="#i-asterisk"/></svg></button>
        <textarea id="chatInput" class="composer-input" rows="1" placeholder="Ваш ход…" aria-label="Сообщение"></textarea>
        <button class="send-btn" id="sendBtn" data-action="send" aria-label="Отправить"><svg class="ic"><use href="#i-send"/></svg></button>
      </footer>
    </section>

    <!-- Pages, sheets and dialogs are appended here in opening order (each is a .modal-overlay). -->
    <div id="layers"></div>
    <div id="toastHost" class="toast-host" aria-live="polite"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
